<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Setup</title>
  <!-- Fuente Orbitron para estilo gamer -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a url("./img/fondo2.png") no-repeat center center fixed;
      background-size: cover;
      color: #00ffff;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      min-height: 100vh;
      padding: 50px 20px;
    }

    h1 {
      font-size: 48px;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 36px;
      margin-top: 40px;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
    }

    h4 {
      font-size: 24px;
      margin-top: 20px;
      margin-bottom: 20px;
      color: white;
      text-shadow: 0 0 5px #00ffcc, 0 0 10px #ff00ff;
    }

    nav {
      margin-top: 50px;
    }

    ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    li {
      font-size: 28px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 2px solid #00ffff;
      border-radius: 10px;
      padding: 15px 25px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      min-width: 200px;
    }

    li:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #ff00ff, inset 0 0 10px rgba(255, 0, 255, 0.3);
    }

    a {
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
      display: block;
      transition: color 0.3s ease;
    }

    a:visited {
      color: #00ffcc;
    }

    a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
    }

    a:active {
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 32px;
      }

      h2 {
        font-size: 24px;
      }

      li {
        font-size: 20px;
        min-width: 150px;
      }

      body {
        padding: 30px 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Gaming Setup!</h1>
    <h4>En esta página encontrarás contenido sobre setups de gaming: Top de video, noticias y más!!</h4>
  </header>

  <nav>
    <h2>🔥 Top Videojuegos 🔥</h2>
    <ul>
      <li><a href="./views/halo.html" title="Ver detalles de Halo">🎮 Halo</a></li>
      <li><a href="./views/gears-of-war.html" title="Ver detalles de Gears of War">⚙️ Gears of War</a></li>
      <li><a href="./views/resident-evil.html" title="Ver detalles de Resident Evil">🧟 Resident Evil</a></li>
      <li><a href="./views/call-of-duty.html" title="Ver detalles de Call of Duty">🕹️ Call of Duty</a></li>
    </ul>
  </nav>
</body>
</html>

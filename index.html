<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Setup</title>
  <!-- Fuente Orbitron para estilo gamer -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0a0a url("./img/fondo2.png") no-repeat center center fixed;
      background-size: cover;
      color: #00ffff;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px;
    }

    h1 {
      font-size: 48px;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
      margin-top: 20px;
    }

    h4 {
      font-size: 24px;
      margin-top: 20px;
      color: white;
      text-shadow: 0 0 5px #00ffcc, 0 0 10px #ff00ff;
    }

    nav h1 {
      margin-top: 40px;
      font-size: 36px;
      text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      font-size: 28px;
      margin: 20px 0;
      background-color: rgba(255, 255, 255, 0.05);
      border: 2px solid #00ffff;
      border-radius: 10px;
      padding: 15px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    li:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #ff00ff;
    }

    nav ul li a {
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
    }

    nav ul li a:visited {
      color: #00ffcc;
    }

    nav ul li a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
    }

    nav ul li a:active {
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Gaming Setup!</h1>
  <h4>En esta página encontrarás contenido sobre setups de gaming: Top de video, noticias y más!!</h4>

      <li><a href="./views/call-of-duty.html">🕹️ Call of Duty</a></li>
    </ul>
  </nav>
</body>
</html>
